name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Remove secrets, real domains and private email content from anything you paste.
        Security problems go through the private process in SECURITY.md, not here.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: dropdown
    id: provider
    attributes:
      label: Mail provider
      options: [Mail.tm, Own domain (local), Both / not sure]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: e.g. v1.0.0 or a commit hash
    validations:
      required: true
  - type: dropdown
    id: setup
    attributes:
      label: How do you run it?
      options: [docker compose, docker compose with docker-compose.prod.yml, Local development, Other]
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs and screenshots
      description: Output of `docker compose logs backend` or the browser console. Remove secrets.
      render: shell
