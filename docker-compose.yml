# Self-hosted stack: `docker compose up -d --build`, then open http://localhost:${WEB_PORT:-3000}
# For a public HTTPS setup, add docker-compose.prod.yml (see README).
name: qamail-manager

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      POSTGRES_DB: ${DB_NAME:-qamail_manager}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    # Not published: only the backend talks to the database

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_NAME: QAMail Manager
      APP_PORT: 8080
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME:-qamail_manager}
      MAILTM_BASE_URL: ${MAILTM_BASE_URL:-https://api.mail.tm}
      INBOX_SYNC_INTERVAL: ${INBOX_SYNC_INTERVAL:-2m}
      # Optional tunables: empty means the default in backend/internal/config/config.go
      MAIL_PROVIDER: ${MAIL_PROVIDER:-}
      CATCHALL_DOMAIN: ${CATCHALL_DOMAIN:-}
      INGEST_SECRET: ${INGEST_SECRET:-}
      INGEST_PORT: ${INGEST_PORT:-}
      INGEST_MAX_BYTES: ${INGEST_MAX_BYTES:-}
      INGEST_MAX_MIME_PARTS: ${INGEST_MAX_MIME_PARTS:-}
      MESSAGE_RETENTION: ${MESSAGE_RETENTION:-}
      MESSAGE_PRUNE_INTERVAL: ${MESSAGE_PRUNE_INTERVAL:-}
      MAILTM_REQUEST_DELAY: ${MAILTM_REQUEST_DELAY:-}
      INBOX_SEARCH_MAX_PAGES: ${INBOX_SEARCH_MAX_PAGES:-}
      USERNAME_MAX_ATTEMPTS: ${USERNAME_MAX_ATTEMPTS:-}
      USERNAME_FIRST_NAMES: ${USERNAME_FIRST_NAMES:-}
      USERNAME_LAST_NAMES: ${USERNAME_LAST_NAMES:-}
      TAG_MAX_LENGTH: ${TAG_MAX_LENGTH:-}
      NOTE_MAX_LENGTH: ${NOTE_MAX_LENGTH:-}
      LEGACY_USERNAME_PATTERN: ${LEGACY_USERNAME_PATTERN:-}
      EVENTS_HEARTBEAT_INTERVAL: ${EVENTS_HEARTBEAT_INTERVAL:-}
      BULK_GENERATE_MAX: ${BULK_GENERATE_MAX:-}
      AUTO_MARK_USED: ${AUTO_MARK_USED:-}
      ACCOUNT_CLEANUP_AFTER: ${ACCOUNT_CLEANUP_AFTER:-}
      ACCOUNT_CLEANUP_ACTION: ${ACCOUNT_CLEANUP_ACTION:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_SECURITY: ${SMTP_SECURITY:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      PASSWORD_MIN_LENGTH: ${PASSWORD_MIN_LENGTH:-}
      SESSION_TTL: ${SESSION_TTL:-}
      LOGIN_MAX_ATTEMPTS: ${LOGIN_MAX_ATTEMPTS:-}
      LOGIN_WINDOW: ${LOGIN_WINDOW:-}
      LOGIN_MAX_CONCURRENT_VERIFIES: ${LOGIN_MAX_CONCURRENT_VERIFIES:-}
      LOGIN_VERIFY_WAIT: ${LOGIN_VERIFY_WAIT:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-}
      USER_ACCOUNT_QUOTA: ${USER_ACCOUNT_QUOTA:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      CLIENT_IP_HEADER: ${CLIENT_IP_HEADER:-}
      TZ: ${TZ:-UTC}
    # Not published: reached through the frontend's nginx at /api, /health and /docs.
    # The ingest server (INGEST_PORT, default 8081) is reached only by cloudflared.

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      # Who may name the real client in X-Forwarded-For (the login rate limit is per client IP).
      # The default trusts nobody. Behind a reverse proxy set the proxy's network CIDR.
      TRUSTED_PROXY_CIDR: ${TRUSTED_PROXY_CIDR:-127.0.0.1}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      # Loopback only by default: the app shows OTPs and, over plain HTTP, the login and
      # session cookie are not encrypted, so it must not be reachable from the LAN. Set
      # WEB_BIND=0.0.0.0 only on a trusted network or behind HTTPS (and COOKIE_SECURE=true).
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-3000}:80"

  # Cloudflare tunnel to the ingest server; enable with COMPOSE_PROFILES=tunnel in .env.
  # In the Cloudflare dashboard, point the tunnel's public hostname at http://backend:8081
  # (or your INGEST_PORT).
  cloudflared:
    image: cloudflare/cloudflared:${CLOUDFLARED_VERSION:-2026.9.3}
    restart: unless-stopped
    profiles: [tunnel]
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres-data:
