openapi: 3.0.3
info:
  title: QAMail Manager API
  description: >
    Backend that proxies Mail.tm accounts and inboxes, and stores own-domain mail, for QA/testing.
    The frontend never receives a Mail.tm password or JWT.

    Every `/api` route except `POST /api/auth/login` needs a session cookie (`qamail_session`,
    set by login). Each user sees only their own accounts and inboxes; another user's account
    answers 404, not 403. Users are created by an admin with the `user` CLI command; there is no
    signup. Without a valid session the API answers 401 `unauthenticated`.

    Error messages are available in English and Indonesian. Send `Accept-Language: id` (or `en`,
    the default) and read the language used from the `Content-Language` response header.
  version: '1.0.0'
servers:
  - url: http://localhost:8080
    description: Local development

security:
  - sessionCookie: []

tags:
  - name: Auth
  - name: Users
  - name: Health
  - name: Accounts
  - name: Inbox

paths:
  /health:
    get:
      tags: [Health]
      summary: Health check
      security: []
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /api/auth/login:
    post:
      tags: [Auth]
      summary: Log in with email and password
      description: >
        Sets the `qamail_session` cookie (HttpOnly, SameSite=Lax, Secure when COOKIE_SECURE=true).
        A wrong email and a wrong password give the same 401, and disabled users cannot log in.
        More than LOGIN_MAX_ATTEMPTS failures per IP and email within LOGIN_WINDOW give 429 with
        a `Retry-After` header.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  example: someone@example.com
                password:
                  type: string
      responses:
        '200':
          description: Logged in; the session cookie is set
          headers:
            Set-Cookie:
              schema:
                type: string
                example: qamail_session=...; Path=/; HttpOnly; SameSite=Lax
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/User'
        '400':
          description: Invalid request body (`invalid_request_body`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Wrong email or password, or user disabled (`invalid_credentials`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Request from another site (`cross_origin_request`). The `Origin` header must be the app's own origin or one listed in `CORS_ALLOWED_ORIGINS`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Too many login tries (`too_many_login_attempts`), or every password-check slot is busy (`login_busy`, retry after 1 second)
          headers:
            Retry-After:
              description: Seconds until the next attempt is allowed
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/auth/logout:
    post:
      tags: [Auth]
      summary: Log out and revoke the session
      responses:
        '200':
          description: Session revoked and cookie cleared
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /api/auth/me:
    get:
      tags: [Auth]
      summary: The logged-in user
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /api/users:
    get:
      tags: [Users]
      summary: List users (admin only)
      description: >
        Every user, oldest first, with the number of mail accounts they own and their quota.
        Passwords and hashes are never returned.
      responses:
        '200':
          description: Users
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/ManagedUser'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/AdminRequired'
    post:
      tags: [Users]
      summary: Create a user (admin only)
      description: >
        There is no public signup. The email is trimmed and lower-cased and must be unique; the
        password must be PASSWORD_MIN_LENGTH to 256 bytes long. Requests from another site are
        refused (`cross_origin_request`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  example: someone@example.com
                password:
                  type: string
                role:
                  type: string
                  enum: [admin, user]
                  default: user
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ManagedUser'
        '400':
          description: Invalid body (`invalid_request_body`), email (`invalid_email`), role (`invalid_role`) or password (`password_too_short`, `password_too_long`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: Not an admin (`admin_required`) or a request from another site (`cross_origin_request`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: A user with this email already exists (`user_exists`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/users/{id}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    patch:
      tags: [Users]
      summary: Disable, enable or reset the password of a user (admin only)
      description: >
        Send `disabled`, `password` or both; they are applied together or not at all. Disabling a
        user and setting a new password both revoke every session of that user at once, which also
        closes their open event streams. Their data is kept. An admin cannot disable their own user,
        and the last enabled admin cannot be disabled.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                disabled:
                  type: boolean
                password:
                  type: string
      responses:
        '200':
          description: Changes applied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Malformed id (`invalid_user_id`), nothing to change (`invalid_input`), bad body (`invalid_request_body`) or bad password (`password_too_short`, `password_too_long`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: Not an admin (`admin_required`) or a request from another site (`cross_origin_request`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No such user (`user_not_found`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Disabling yourself (`cannot_modify_self`) or the last enabled admin (`last_admin`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags: [Users]
      summary: Delete a user (admin only)
      description: >
        Refused with 409 `user_has_accounts` (and `params.accounts`) while the user owns mail
        accounts, unless `force=true`, which also deletes those accounts and their stored messages
        from this database (the mailboxes at the provider are not touched). The user's sessions end
        with the user. An admin cannot delete their own user or the last enabled admin.
      parameters:
        - name: force
          in: query
          description: Also delete the user's accounts and messages
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Deleted; `data.accounts` is how many accounts went with the user
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          accounts:
                            type: integer
                            example: 0
        '400':
          description: Malformed id (`invalid_user_id`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: Not an admin (`admin_required`) or a request from another site (`cross_origin_request`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No such user (`user_not_found`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: The user owns accounts and `force` is not set (`user_has_accounts`), or it is yourself (`cannot_modify_self`) or the last enabled admin (`last_admin`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/settings:
    get:
      tags: [Settings]
      summary: Runtime configuration
      description: >
        Providers with their current domain and availability, label limits and inbox options.
        Values come from environment variables (see .env.example); the UI uses them instead of
        hard-coded copies. Readable by every logged-in user; non-admins get a reduced view (only
        the editable settings the generate dialogs need, no defaults or overrides, no sending flag).
      responses:
        '200':
          description: Current settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
                properties:
                  data:
                    $ref: '#/components/schemas/AppSettings'

    patch:
      tags: [Settings]
      summary: Change editable settings (admin only)
      description: >
        `values` sets keys (same names as `editable` in GET /api/settings), `reset` returns keys
        to their environment defaults. The whole result is validated before anything is saved;
        changes apply immediately and survive restarts.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                values:
                  type: object
                  additionalProperties: true
                  example: { tagMaxLength: 80, messageRetention: "168h", defaultProvider: "local" }
                reset:
                  type: array
                  items:
                    type: string
                  example: [usernameFirstNames]
      responses:
        '200':
          description: Updated settings (same shape as GET)
        '400':
          description: Unknown key or invalid value
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/AdminRequired'

  /api/ingest:
    post:
      tags: [Ingest]
      summary: Store a raw email for a local-provider account
      security: []
      description: >
        Served only on the ingest server (INGEST_PORT, default 8081), not on the main API port.
        Called by the Cloudflare Email Worker through the tunnel. Disabled when INGEST_SECRET is empty.
      parameters:
        - in: header
          name: X-Ingest-Secret
          required: true
          schema:
            type: string
        - in: header
          name: X-Envelope-To
          required: false
          description: SMTP recipient reported by Cloudflare; preferred over the To/Cc headers
          schema:
            type: string
      requestBody:
        required: true
        content:
          message/rfc822:
            schema:
              type: string
              format: binary
      responses:
        '201':
          description: Stored
        '200':
          description: Duplicate Message-ID for this account; nothing stored
        '400':
          description: Empty body
        '401':
          description: Missing or wrong secret
        '404':
          description: No local account for the recipient (the Worker rejects the email)
        '413':
          description: Larger than INGEST_MAX_BYTES
        '422':
          description: Not a parseable email

  /api/accounts/generate:
    post:
      tags: [Accounts]
      summary: Generate a new mailbox account and save it
      description: >
        Picks a domain on the requested provider (default from MAIL_PROVIDER), generates a
        human-looking username (e.g. rinda.saputra91) and a random password, registers the
        mailbox (Mail.tm only; the local catch-all needs no registration), and persists it to
        PostgreSQL. The optional tag, note and provider are validated before anything is created.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateAccountRequest'
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
                properties:
                  data:
                    $ref: '#/components/schemas/MailAccount'
        '400':
          description: Invalid body, tag/note too long, or unknown provider
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: >
            Account quota full (`quota_exceeded`; params `limit`, `used`, `remaining`, `requested`).
            A bulk request larger than the remaining quota is rejected as a whole.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Provider request failed (e.g. Mail.tm down or CATCHALL_DOMAIN not set)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/accounts:
    get:
      tags: [Accounts]
      summary: List stored accounts (paginated)
      parameters:
        - name: search
          in: query
          description: Case-insensitive match on email, domain, tag or note
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [AVAILABLE, USED, BLOCKED]
        - name: provider
          in: query
          schema:
            type: string
            enum: [mailtm, local]
        - name: legacy
          in: query
          description: Only accounts whose address matches LEGACY_USERNAME_PATTERN (old, detectable naming)
          schema:
            type: boolean
        - name: sort
          in: query
          description: >
            `newest` (default) orders by creation date. `latest_message` puts accounts with the most
            recent inbox activity first (refreshed by the background inbox sync).
          schema:
            type: string
            enum: [newest, latest_message]
        - $ref: '#/components/parameters/Page'
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
      responses:
        '200':
          description: One page of accounts
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/MailAccount'
                      meta:
                        $ref: '#/components/schemas/PageMeta'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/accounts/stats:
    get:
      tags: [Accounts]
      summary: Account counts per status and per domain
      description: Counts only the logged-in user's accounts. `quota` shows their usage.
      responses:
        '200':
          description: Aggregated counts
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AccountStats'

  /api/accounts/{id}/status:
    patch:
      tags: [Accounts]
      summary: Update an account's status
      parameters:
        - $ref: '#/components/parameters/AccountId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateStatusRequest'
      responses:
        '200':
          description: Status updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Invalid id, body, or status value
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Account not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/accounts/{id}:
    get:
      tags: [Accounts]
      summary: Get a single account
      parameters:
        - $ref: '#/components/parameters/AccountId'
      responses:
        '200':
          description: The account
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/MailAccount'
        '404':
          description: Account not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      tags: [Accounts]
      summary: Edit an account's tag and/or note
      description: Omitted fields are left unchanged; an empty string clears the value.
      parameters:
        - $ref: '#/components/parameters/AccountId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateAccountRequest'
      responses:
        '200':
          description: The updated account
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/MailAccount'
        '400':
          description: Invalid body, nothing to update, or tag/note too long
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Account not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags: [Accounts]
      summary: Delete an account (database only, Mail.tm side untouched)
      parameters:
        - $ref: '#/components/parameters/AccountId'
      responses:
        '200':
          description: Account deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Invalid account id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Account not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/accounts/{id}/messages:
    get:
      tags: [Inbox]
      summary: List messages in the account's inbox, newest first
      description: >
        Logs into Mail.tm on demand; the JWT is never persisted. Pages hold up to 30 messages
        (Mail.tm's page size). Mail.tm has no search API, so `search` scans up to 10 pages (300 messages)
        and returns every match in a single page; `meta.truncated` is true when the scan stopped early.
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - $ref: '#/components/parameters/Page'
        - name: search
          in: query
          description: Case-insensitive match on subject, intro, sender name or address
          schema:
            type: string
      responses:
        '200':
          description: One page of messages
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/MessageSummary'
                      meta:
                        allOf:
                          - $ref: '#/components/schemas/PageMeta'
                          - type: object
                            properties:
                              truncated:
                                type: boolean
        '400':
          description: Invalid account id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Account or message not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Mail.tm request failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/accounts/{id}/messages/{messageId}:
    get:
      tags: [Inbox]
      summary: Get a single message's full detail
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - name: messageId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Message detail
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/MessageDetail'
        '400':
          description: Invalid account id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Account or message not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Mail.tm request failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      tags: [Inbox]
      summary: Permanently delete a message on Mail.tm
      description: The account's message count and latest-message time are refreshed afterwards.
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - name: messageId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Message deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Invalid account id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Account or message not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Mail.tm request failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/accounts/{id}/messages/{messageId}/read:
    patch:
      tags: [Inbox]
      summary: Mark a message as read on Mail.tm
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - name: messageId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Message marked as read
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          seen:
                            type: boolean
                            example: true
        '400':
          description: Invalid account id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Account or message not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Mail.tm request failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/accounts/{id}/messages/{messageId}/attachments/{attachmentId}:
    get:
      tags: [Inbox]
      summary: Download an attachment
      description: >
        Images and plain text open in the browser; every other type is sent as a download.
        `download=true` always downloads.
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - name: messageId
          in: path
          required: true
          schema:
            type: string
        - name: attachmentId
          in: path
          required: true
          schema:
            type: string
        - name: download
          in: query
          schema:
            type: boolean
      responses:
        '200':
          description: The file
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '404':
          description: Account, message or attachment not found

  /api/accounts/{id}/messages/{messageId}/source:
    get:
      tags: [Inbox]
      summary: Raw message source (RFC 5322) with all headers
      description: Shown as text/plain; `download=true` saves it as .eml (message/rfc822).
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - name: messageId
          in: path
          required: true
          schema:
            type: string
        - name: download
          in: query
          schema:
            type: boolean
      responses:
        '200':
          description: Raw message
          content:
            text/plain:
              schema:
                type: string
        '404':
          description: Account or message not found (or stored before raw sources were kept)

  /api/accounts/generate/bulk:
    post:
      tags: [Accounts]
      summary: Generate several accounts with the same labels
      description: Up to BULK_GENERATE_MAX. Stops at the first failure and keeps what was created (see `error`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/GenerateAccountRequest'
                - type: object
                  required: [count]
                  properties:
                    count:
                      type: integer
                      minimum: 1
      responses:
        '201':
          description: Accounts created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
                properties:
                  data:
                    type: object
                    properties:
                      accounts:
                        type: array
                        items:
                          $ref: '#/components/schemas/MailAccount'
                      requested:
                        type: integer
                      error:
                        type: string
        '400':
          description: Invalid count or labels
        '403':
          description: >
            Account quota full (`quota_exceeded`; params `limit`, `used`, `remaining`, `requested`).
            A bulk request larger than the remaining quota is rejected as a whole.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/accounts/export:
    get:
      tags: [Accounts]
      summary: Export accounts as CSV
      description: Same filters as GET /api/accounts (search, status, provider, legacy). Passwords are never exported.
      responses:
        '200':
          description: CSV file
          content:
            text/csv:
              schema:
                type: string

  /api/accounts/{id}/messages/send:
    post:
      tags: [Inbox]
      summary: Send or reply from an own-domain account (admin only)
      description: >
        Plain text through the configured SMTP server (SMTP_HOST). Mail.tm accounts cannot send.
        `replyTo` (a message id from this inbox) threads the reply with In-Reply-To/References.
      parameters:
        - $ref: '#/components/parameters/AccountId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to]
              properties:
                to:
                  type: array
                  items:
                    type: string
                    format: email
                subject:
                  type: string
                text:
                  type: string
                replyTo:
                  type: string
      responses:
        '201':
          description: Sent
        '400':
          description: Sending disabled, Mail.tm account, or invalid input
        '403':
          $ref: '#/components/responses/AdminRequired'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          description: SMTP server refused or unreachable

  /api/accounts/{id}/replace:
    post:
      tags: [Accounts]
      summary: Replace an address with a new realistic one
      description: >
        Generates a new address on the same provider with the same tag and note, and marks the
        old account BLOCKED. Meant for addresses flagged by LEGACY_USERNAME_PATTERN.
      parameters:
        - $ref: '#/components/parameters/AccountId'
      responses:
        '201':
          description: Replacement created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
                properties:
                  data:
                    type: object
                    properties:
                      account:
                        $ref: '#/components/schemas/MailAccount'
                      replacedId:
                        type: string
                        format: uuid
        '404':
          description: Account not found
        '502':
          description: Provider request failed

  /api/events:
    get:
      tags: [Settings]
      summary: Live updates (server-sent events)
      description: >
        Streams `message.created`, `accounts.changed` and `settings.changed` events as
        `event: <type>` / `data: <json>` frames, with a comment heartbeat every
        EVENTS_HEARTBEAT_INTERVAL. A user only receives events for their own accounts.
        Uses the session cookie (same origin), so a browser `EventSource` works as is.
      responses:
        '200':
          description: Event stream
          content:
            text/event-stream:
              schema:
                type: string

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: qamail_session
      description: Session token set by POST /api/auth/login. HttpOnly, so browsers send it automatically.

  responses:
    Unauthenticated:
      description: No valid session (`unauthenticated`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    AdminRequired:
      description: Only admins may do this (`admin_required`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Account or message not found, or owned by another user (`account_not_found`, `message_not_found`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  parameters:
    Page:
      name: page
      in: query
      description: 1-based page number
      schema:
        type: integer
        default: 1
        minimum: 1
    UserId:
      name: id
      in: path
      required: true
      description: User UUID
      schema:
        type: string
        format: uuid
    AccountId:
      name: id
      in: path
      required: true
      description: MailAccount UUID
      schema:
        type: string
        format: uuid

  schemas:
    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Success
        data:
          nullable: true

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          description: Human-readable text in English or Indonesian, chosen by the `Accept-Language` request header (English by default)
        code:
          type: string
          description: >
            Stable identifier clients translate, e.g. label_too_long, unknown_domain,
            account_not_found, invalid_request_body, unauthenticated, invalid_credentials, admin_required,
            quota_exceeded, too_many_login_attempts, login_busy, cross_origin_request, user_not_found, user_exists,
            user_has_accounts, last_admin, cannot_modify_self, invalid_user_id, invalid_email, invalid_role,
            password_too_short, password_too_long, upstream_error, internal_error. Ingest endpoint:
            invalid_ingest_secret, empty_body, recipient_not_found, malformed_email.
          example: label_too_long
        params:
          type: object
          additionalProperties: true
          description: Values for the translation placeholders; only set for validation errors
          example:
            field: tag
            max: 50
            got: 61

    GenerateAccountRequest:
      type: object
      properties:
        tag:
          type: string
          description: At most TAG_MAX_LENGTH characters (default 50)
          example: login-flow
        note:
          type: string
          description: At most NOTE_MAX_LENGTH characters (default 500)
          example: Used for the OTP regression suite
        provider:
          type: string
          enum: [mailtm, local]
          description: Omit to use the server default (MAIL_PROVIDER)
        domain:
          type: string
          description: One of the provider's domains (GET /api/settings); omit to pick at random

    AppSettings:
      type: object
      properties:
        defaultProvider:
          type: string
          example: local
        providers:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
                enum: [mailtm, local]
              label:
                type: string
              domain:
                type: string
                example: inbox.example.com
              available:
                type: boolean
              error:
                type: string
                description: Why the provider cannot generate accounts right now
        limits:
          type: object
          properties:
            tagMaxLength:
              type: integer
              example: 50
            noteMaxLength:
              type: integer
              example: 500
        inbox:
          type: object
          properties:
            syncInterval:
              type: string
              example: 2m0s
            searchMaxPages:
              type: integer
              example: 10
            messageRetention:
              type: string
              example: 720h0m0s
            ingestEnabled:
              type: boolean
            sendingEnabled:
              type: boolean
              description: SMTP is configured

    UpdateStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [AVAILABLE, USED, BLOCKED]

    MailAccount:
      type: object
      properties:
        id:
          type: string
          format: uuid
        provider:
          type: string
          enum: [mailtm, local]
        legacyName:
          type: boolean
          description: Address matches LEGACY_USERNAME_PATTERN and should be replaced
        accountId:
          type: string
        email:
          type: string
          format: email
        domain:
          type: string
        status:
          type: string
          enum: [AVAILABLE, USED, BLOCKED]
        tag:
          type: string
        note:
          type: string
        lastMessageAt:
          type: string
          format: date-time
          nullable: true
          description: Newest inbox message time, refreshed by the background sync
        messageCount:
          type: integer
          description: Total messages in the inbox at the last sync
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    PageMeta:
      type: object
      properties:
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
        hasMore:
          type: boolean

    AccountStats:
      type: object
      properties:
        total:
          type: integer
        byStatus:
          type: object
          additionalProperties:
            type: integer
          example: { AVAILABLE: 3, USED: 1, BLOCKED: 0 }
        byDomain:
          type: array
          items:
            type: object
            properties:
              domain:
                type: string
              count:
                type: integer
        byProvider:
          type: array
          items:
            type: object
            properties:
              provider:
                type: string
              count:
                type: integer
              messages:
                type: integer
                description: Sum of recorded inbox sizes
        legacy:
          type: integer
          description: Accounts matching LEGACY_USERNAME_PATTERN
        quota:
          $ref: '#/components/schemas/Quota'

    Quota:
      type: object
      description: >
        Accounts counted against the limit. BLOCKED accounts are not counted. `limit` and
        `remaining` are null for admins (no limit). The limit is USER_ACCOUNT_QUOTA, which an
        admin can change in Settings.
      properties:
        used:
          type: integer
          example: 7
        limit:
          type: integer
          nullable: true
          example: 10
        remaining:
          type: integer
          nullable: true
          example: 3

    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        role:
          type: string
          enum: [admin, user]

    ManagedUser:
      type: object
      description: A user as an admin sees them. Never carries the password or its hash.
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        role:
          type: string
          enum: [admin, user]
        disabled:
          type: boolean
        accounts:
          type: integer
          description: Every mail account the user owns, blocked ones included
        quota:
          $ref: '#/components/schemas/Quota'
        createdAt:
          type: string
          format: date-time

    MessageSummary:
      type: object
      properties:
        id:
          type: string
        subject:
          type: string
        intro:
          type: string
        seen:
          type: boolean
        createdAt:
          type: string
          format: date-time
        from:
          type: object
          properties:
            address:
              type: string
            name:
              type: string

    MessageDetail:
      type: object
      properties:
        id:
          type: string
        subject:
          type: string
        seen:
          type: boolean
        from:
          type: object
          properties:
            address:
              type: string
            name:
              type: string
        to:
          type: array
          items:
            type: object
            properties:
              address:
                type: string
              name:
                type: string
        text:
          type: string
        html:
          type: array
          items:
            type: string
        attachments:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              filename:
                type: string
              contentType:
                type: string
              size:
                type: integer
              contentId:
                type: string
                description: Referenced from the HTML body as cid:<contentId>
        createdAt:
          type: string
          format: date-time
